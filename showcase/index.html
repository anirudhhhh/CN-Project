<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sender / MA3104 VPN</title><link rel="stylesheet" href="/style.css"><header><b>MA3104 VPN / SENDER</b><nav><a href="/receiver" target="receiver">Receiver ↗</a><a href="/vpn-server" target="vpn-server">VPN server ↗</a></nav><a href="/guide" target="guide">Setup guide ↗</a></header><main><small>01 / sender</small><h1>Send a packet.</h1><form id="form"><div class="grid"><div><label for="vpn">My VPN server IP : port</label><input id="vpn" value="127.0.0.1:9090" required></div><div><label for="address">Receiver IP : port</label><input id="address" value="127.0.0.1:8000" required></div></div><label for="message">Message / plaintext</label><textarea id="message" required maxlength="12000" placeholder="Enter the message to send…"></textarea><button id="send">Send via my VPN server →</button></form><div class="status" id="status" role="status">Ready. Configure the receiver’s trusted VPN IP in its window first.</div><div class="meta" id="receipt"></div><footer>The sender connects to the VPN endpoint you enter. The VPN forwards the message to your receiver. Open the three windows side by side.</footer></main><script>fetch('/api/info').then(r=>r.json()).then(s=>{if(s.role!=='all')document.querySelector('nav').hidden=true}).catch(()=>{});
const $=s=>document.querySelector(s);for(const id of ['vpn','address']){const v=localStorage.getItem('sender-'+id);if(v)$('#'+id).value=v}$('#form').onsubmit=async e=>{e.preventDefault();$('#send').disabled=true;$('#status').textContent='Sending through VPN…';$('#receipt').textContent='';try{let vpn=$('#vpn').value.trim(),address=$('#address').value.trim();localStorage.setItem('sender-vpn',vpn);localStorage.setItem('sender-address',address);let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vpn,address,message:$('#message').value})});let data=await r.json();if(!r.ok)throw Error(data.error);if(!data.ok)throw Error(data.error||'No receiver acknowledgement');$('#status').textContent='Delivered. Check the receiver window.';$('#receipt').textContent=`Packet ${data.id} / ${data.ms} ms / receiver confirmed exact message`;}catch(e){$('#status').textContent='Delivery failed: '+e.message}finally{$('#send').disabled=false}};
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receiver / Spiced Chai</title><link rel="stylesheet" href="/style.css"><header><b>SPICED CHAI / RECEIVER</b><nav><a href="/" target="sender">Sender ↗</a><a href="/vpn-server" target="vpn-server">VPN server ↗</a></nav><a href="/guide" target="guide">Setup guide ↗</a></header><main><small>02 / receiver</small><h1>Received packets.</h1><form id="config" class="config"><label for="vpn">My trusted VPN server IP</label><input id="vpn" value="127.0.0.1" required><button>Apply VPN server</button><p class="meta">Accept incoming messages only from this VPN server’s IP. This configures an inbound source-IP filter; the receiver does not establish its own tunnel.</p></form><div id="status" class="status" role="status"></div><section id="packets"><div class="empty">Waiting for a packet…</div></section></main><script>fetch('/api/info').then(r=>r.json()).then(s=>{if(s.role!=='all')document.querySelector('nav').hidden=true}).catch(()=>{});
const $=s=>document.querySelector(s);let initialized=false;async function load(){try{let r=await fetch('/api/receiver');let s=await r.json();if(!initialized){$('#vpn').value=s.vpn;initialized=true}document.title='Receiver / '+s.address;let box=$('#packets');box.replaceChildren();for(let row of s.packets){let article=document.createElement('article');article.className='packet';let meta=document.createElement('div');meta.className='meta';meta.textContent=`${row.time} / packet ${row.id} / from ${row.peer}`;let msg=document.createElement('div');msg.className='message';msg.textContent=row.message;article.append(meta,msg);box.append(article)}if(!s.packets.length){let p=document.createElement('p');p.className='empty';p.textContent='Waiting for a packet…';box.append(p)}}catch(e){$('#status').textContent='Receiver console unavailable'}}$('#config').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/receiver/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vpn:$('#vpn').value.trim()})});let s=await r.json();if(!r.ok)throw Error(s.error);$('#status').textContent='Accepting packets from VPN '+s.vpn}catch(e){$('#status').textContent=e.message}};load();setInterval(load,900);
</script></html>
